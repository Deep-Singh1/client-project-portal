name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cpp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cpp_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # Prisma (CI DB)
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cpp_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/cpp_test?schema=public

      # Your auth/session signing
      AUTH_SECRET: ci-secret-change-me

      # Make tools behave in CI
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Migrate DB
        run: npm run db:migrate

      - name: Seed DB
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build (Next.js)
        run: npm run build

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres -d cpp_test && exit 0
            sleep 1
          done
          exit 1


        